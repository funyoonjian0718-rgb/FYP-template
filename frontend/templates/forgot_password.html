<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Forgot Password — Dietary Advice RAG</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-container">
        <div class="auth-heading">
          <div class="title">Forgot Password</div>
          <div class="muted">Enter your email to receive a reset token.</div>
        </div>

        <div class="auth-card card">
          <div class="card-title">Reset request</div>
          <div class="row">
            <div>
              <label>Email</label>
              <input id="fpEmail" placeholder="you@example.com" />
            </div>
          </div>
          <div class="actions mt12">
            <button id="btnForgot" class="btn btn-primary" type="button">Send reset request</button>
            <div id="fpMsg" class="muted"></div>
          </div>
          <div class="muted mt16" style="text-align: center;">
            After submitting, check your email for the reset token and continue on the next page.
          </div>
          <div class="muted mt16" style="text-align: center;">
            <a href="/login" style="color: #4f46e5;">Back to login</a>
          </div>
        </div>
      </div>
    </div>

    <script>
      function $(id) { return document.getElementById(id); }
      function escapeHtml(s) {
        return String(s)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#039;');
      }

      async function api(path, { method = 'GET', body = null } = {}) {
        const headers = { 'Content-Type': 'application/json' };
        const res = await fetch(path, {
          method,
          headers,
          body: body ? JSON.stringify(body) : null,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data?.detail || `HTTP ${res.status}`);
        }
        return data;
      }

      $('btnForgot').addEventListener('click', async () => {
        const msg = $('fpMsg');
        msg.textContent = '';
        try {
          const payload = { email: $('fpEmail').value.trim() };
          const res = await api('/auth/forgot-password', { method: 'POST', body: payload });
          msg.innerHTML = `<span class="success">${escapeHtml(res.message || 'Request sent')}</span>`;
          if (res.email_error) {
            msg.innerHTML += `<div class="alert alert-error">Email error: ${escapeHtml(res.email_error)}</div>`;
          }
          if (res.reset_token) {
            msg.innerHTML += `<div class="mt12">If SMTP is not configured, the reset token was generated locally: <strong>${escapeHtml(res.reset_token)}</strong></div>`;
          }
          setTimeout(() => {
            window.location.href = '/reset-password';
          }, 1200);
        } catch (e) {
          msg.innerHTML = `<span class="danger">${escapeHtml(e.message)}</span>`;
        }
      });
    </script>
  </body>
</html>
