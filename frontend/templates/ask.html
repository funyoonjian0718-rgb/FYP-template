<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ask - NutriDiag</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>.grid{display:grid;grid-template-columns:1fr 420px;gap:20px}</style>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header"><div class="sidebar-logo">🥗</div><div class="sidebar-title"><h2>NutriDiag</h2><p>Dietary Assistant</p></div></div>
      <nav class="sidebar-nav">
        <a class="nav-item" href="/dashboard">📊 Dashboard</a>
        <a class="nav-item active" href="/ask">❓ Ask Recommendation</a>
        <a class="nav-item" href="/history">📜 My History</a>
        <a class="nav-item" href="/profile">👤 My Profile</a>
      </nav>
      <div class="sidebar-footer"><div class="user-profile-mini"><div class="user-avatar" id="userAvatar">U</div><div class="user-info"><strong id="userEmail">user@example.com</strong><p>Logged in</p></div></div></div>
    </aside>

    <div class="main-content">
      <div class="topbar"><div><div class="topbar-title">Ask Recommendation</div><div class="topbar-subtitle">Get dietary advice using AI</div></div><div class="topbar-actions"><button class="btn-logout" onclick="logout()">Logout</button></div></div>

      <div style="padding:32px;">
        <div class="grid">
          <div>
            <div class="card"><div class="card-title">❓ Ask Your Dietary Question</div>
              <div class="form-group"><label>Dropdown dish (recommended)</label><select id="foodDropdown" style="width:100%"><option value="">(not selected)</option></select></div>
              <div class="form-group"><label>Portion Size</label><select id="portion" style="width:100%"><option value="">(not set)</option><option value="small">Small</option><option value="medium">Medium</option><option value="large">Large</option></select></div>
              <div class="form-group"><label>Optional free-text food</label><input id="freeFood" type="text" placeholder="e.g., nasi lemak + teh tarik" /></div>
              <div class="form-group"><label>Your Question</label><textarea id="question" placeholder="e.g., Is nasi lemak okay for someone with Type 2 diabetes?"></textarea></div>
              <div class="actions"><button id="btnAsk" class="btn btn-primary" onclick="askQuestion()">🔍 Get Recommendation</button></div>
              <div id="askMsg" class="muted" style="margin-top:12px"></div>
            </div>
          </div>

          <div>
            <div class="card"><div class="card-title">📝 AI Recommendation</div><div id="answer" style="color:#b0b0b0;min-height:200px">No answer yet.</div></div>
            <div class="card"><div class="card-title">📚 Retrieved References</div><div id="refs" style="color:#b0b0b0">References will appear here</div></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
  <script>
    async function initAsk(){
      if(!state.token) window.location.href='/login';
      document.getElementById('userAvatar').textContent = (state.user.email||'U')[0].toUpperCase();
      document.getElementById('userEmail').textContent = state.user.email||'user@example.com';
      await loadFoods();
    }

    async function askQuestion(){
      const msg = document.getElementById('askMsg'); msg.textContent='';
      document.getElementById('answer').innerHTML = '<span class="loading"></span> Working…';
      document.getElementById('refs').textContent = '';
      try{
        const payload = { query_text: document.getElementById('question').value.trim(), selected_food: document.getElementById('foodDropdown').value||null, portion: document.getElementById('portion').value||null, free_text_food: document.getElementById('freeFood').value.trim()||null };
        if(!payload.query_text) throw new Error('Please enter a question');
        const data = await api('/diet/query',{method:'POST', body: payload});
        document.getElementById('answer').innerHTML = `<div class="answer-section">${escapeHtml(data.formatted_answer)}</div>`;
        const refs = data.references||[];
        if(!refs.length) document.getElementById('refs').innerHTML = '<div class="alert alert-warning">No references retrieved</div>';
        else document.getElementById('refs').innerHTML = refs.map(r=>`<div class="reference-card"><div class="reference-source">📄 ${escapeHtml(r.source)}</div><div class="reference-snippet">${escapeHtml(r.snippet)}</div></div>`).join('');
        msg.innerHTML = '<div class="alert alert-success">✓ Done</div>';
      }catch(e){ document.getElementById('answer').innerHTML = `<div class="alert alert-error">❌ ${escapeHtml(e.message)}</div>`; msg.innerHTML = `<div class="alert alert-error">Error: ${escapeHtml(e.message)}</div>`; }
    }

    initAsk();
  </script>
</body>
</html>
