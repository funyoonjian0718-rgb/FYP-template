<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reset Password — Dietary Advice RAG</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-container">
        <div class="auth-heading">
          <div class="title">Reset Password</div>
          <div class="muted">Choose a new password for your account.</div>
        </div>

        <div class="auth-card card">
          <div class="card-title">New password</div>
          <div class="row">
            <div>
              <label>Reset token</label>
              <input id="resetToken" value="{{ token }}" />
            </div>
          </div>
          <div class="row mt12">
            <div>
              <label>New password</label>
              <input id="newPassword" type="password" placeholder="••••••••" />
            </div>
          </div>
          <div class="actions mt12">
            <button id="btnReset" class="btn btn-primary" type="button">Update password</button>
            <div id="resetMsg" class="muted"></div>
          </div>
          <div class="muted mt16" style="text-align: center;">
            <a href="/login" style="color: #4f46e5;">Back to login</a>
          </div>
        </div>
      </div>
    </div>

    <script>
      function $(id) { return document.getElementById(id); }
      function escapeHtml(s) {
        return String(s)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#039;');
      }

      async function api(path, { method = 'GET', body = null } = {}) {
        const headers = { 'Content-Type': 'application/json' };
        const res = await fetch(path, {
          method,
          headers,
          body: body ? JSON.stringify(body) : null,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data?.detail || `HTTP ${res.status}`);
        }
        return data;
      }

      $('btnReset').addEventListener('click', async () => {
        const msg = $('resetMsg');
        msg.textContent = '';
        try {
          const payload = {
            token: $('resetToken').value.trim(),
            new_password: $('newPassword').value,
          };
          const res = await api('/auth/reset-password', { method: 'POST', body: payload });
          msg.innerHTML = `<span class="success">${escapeHtml(res.message || 'Password updated')}</span>`;
          setTimeout(() => window.location.href = '/login', 1000);
        } catch (e) {
          msg.innerHTML = `<span class="danger">${escapeHtml(e.message)}</span>`;
        }
      });
    </script>
  </body>
</html>
