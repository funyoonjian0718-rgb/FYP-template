<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - NutriDiag</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header"><div class="sidebar-logo">🥗</div><div class="sidebar-title"><h2>NutriDiag</h2><p>Dietary Assistant</p></div></div>
      <nav class="sidebar-nav">
        <a class="nav-item" href="/dashboard">📊 Dashboard</a>
        <a class="nav-item" href="/ask">❓ Ask Recommendation</a>
        <a class="nav-item" href="/history">📜 My History</a>
        <a class="nav-item active" href="/profile">👤 My Profile</a>
      </nav>
      <div class="sidebar-footer"><div class="user-profile-mini"><div class="user-avatar" id="userAvatar">U</div><div class="user-info"><strong id="userEmail">user@example.com</strong><p>Logged in</p></div></div></div>
    </aside>

    <div class="main-content">
      <div class="topbar"><div><div class="topbar-title">My Profile</div><div class="topbar-subtitle">Update your health information</div></div><div class="topbar-actions"><button class="btn-logout" onclick="logout()">Logout</button></div></div>

      <div style="padding:32px;"><div class="card"><div class="card-title">👤 My Profile</div>
        <div style="margin-bottom:24px;"><div class="user-avatar" style="width:80px;height:80px;font-size:32px;margin-bottom:16px;" id="profileAvatar">U</div><p style="color:#e0e0e0;"><strong id="profileEmail">user@example.com</strong></p><p style="color:#888;font-size:12px;" id="profileJoined">Member since</p></div>
        <div class="section-title">Health Information</div>
        <div class="form-group"><label>Type 2 Diabetes</label><select id="profileDiabetes" style="width:100%"><option value="false">No</option><option value="true">Yes</option></select></div>
        <div class="form-group"><label>Age</label><input id="profileAge" type="number" min="1" max="120" /></div>
        <div class="form-group"><label>Weight (kg)</label><input id="profileWeight" type="number" min="1" step="0.1" /></div>
        <div class="form-group"><label>Activity Level</label><select id="profileActivity" style="width:100%"><option value="">Not set</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></div>
        <div class="actions"><button class="btn btn-primary" onclick="updateProfile()">✓ Update Profile</button><button class="btn btn-secondary" onclick="logout()">🚪 Logout</button></div>
        <div id="profileMsg" class="muted" style="margin-top:12px"></div>
      </div></div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
  <script>
    async function initProfile(){
      if(!state.token) window.location.href='/login';
      document.getElementById('userAvatar').textContent = (state.user.email||'U')[0].toUpperCase();
      document.getElementById('userEmail').textContent = state.user.email||'user@example.com';
      await loadProfile();
    }
    initProfile();
  </script>
</body>
</html>
